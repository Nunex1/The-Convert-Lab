name: Backend regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Python 3.13 backend
        run: docker build -f backend/Dockerfile -t convertlab-test .
      - name: Test real conversions under production restrictions
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,size=512m,mode=1777
          --memory 512m --cpus 2 --pids-limit 128 --cap-drop ALL
          --security-opt no-new-privileges convertlab-test
          python -m pytest backend/tests -v -p no:cacheprovider
